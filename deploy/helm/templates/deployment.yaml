apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane-mcp.fullname" . }}
  labels: {{- include "plane-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "plane-mcp.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "plane-mcp.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: plane-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.env.MCP_PORT | int }}
          envFrom:
            - configMapRef:
                name: {{ include "plane-mcp.fullname" . }}
            {{- if or .Values.existingSecret .Values.secretEnv }}
            - secretRef:
                name: {{ .Values.existingSecret | default (include "plane-mcp.fullname" .) }}
            {{- end }}
          # MCP 端点需要认证头，用 TCP 探测避免 401
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
